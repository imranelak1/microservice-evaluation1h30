spring.application.name=product-app
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.org.hibernate=WARN

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3307}/${DB_NAME:evaluation_produits}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:evaluation}
spring.datasource.password=${DB_PASSWORD:evaluation_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5

hibernate.hbm2ddl.auto=${HIBERNATE_DDL_AUTO:update}
hibernate.show_sql=${HIBERNATE_SHOW_SQL:false}
hibernate.format_sql=true
app.demo.enabled=${DEMO_ENABLED:true}
